services:
  postgres:
    image: postgres:16
    container_name: ceris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hunteroftheknight
      POSTGRES_DB: factory_size
    ports:
      - "5433:5432"
    volumes:
      - ceris_postgres_data:/var/lib/postgresql/data

volumes:
  ceris_postgres_data:
